# Render Blueprint για το subcontractor.gr: web service και βάση PostgreSQL.
# (Τα ονόματα electrobid/electrobid-db μένουν ίδια: αν αλλάξουν, το Render φτιάχνει νέο service.)
# Render → New → Blueprint → επιλέξτε το repo.
services:
  - type: web
    name: electrobid
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements-prod.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py seed_demo $([ "$SEED_RESET" = "1" ] && echo --reset)
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # Βάλτε 1 για ένα deploy ώστε να ξαναδημιουργηθούν τα demo δεδομένα (μόνο @demo.gr)
      - key: SEED_RESET
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: electrobid-db
          property: connectionString

databases:
  - name: electrobid-db
    plan: free
